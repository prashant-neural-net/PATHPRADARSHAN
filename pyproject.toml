[project]
name = "pathpradarshan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prashant Tripathi", email = "prashant-neural-net@gmail.com" }
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "fastapi>=0.141.1",
    "osmnx>=2.1.1",
    "python-multipart>=0.0.32",
    "rasterio>=1.4.4",
    "torch>=2.13.0",
    "uvicorn>=0.52.3",
]

[tool.uv]
package=false

[project.scripts]
pathpradarshan = "pathpradarshan:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
